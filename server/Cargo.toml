[package]
name = "hrms-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id", "compression-gzip", "set-header", "util", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
tower = { version = "0.5.3", features = ["util"] }
