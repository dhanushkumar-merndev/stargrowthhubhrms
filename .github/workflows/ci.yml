name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # SQL suites on the same Supabase Postgres image as production.
      - run: tools/db_test.sh
      # API tests: fresh DB, migrations applied by sqlx exactly like start-up.
      - run: tools/db_test.sh --empty
      - run: cargo test
        env:
          HRMS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54330/postgres

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @web-hrms/web lint
      - run: pnpm --filter @web-hrms/web typecheck
      - run: pnpm --filter @web-hrms/web test
      - run: pnpm --filter @web-hrms/web build
        env:
          API_ORIGIN: http://localhost:8080
          PROXY_SECRET: ci-only-proxy-secret-not-used-anywhere-000
